# Индекс реестра готовых стеков.
#
# Панель читает этот файл первым и по нему знает, что вообще есть в каталоге.
# Обязательны у записи только id и path — id обязан совпадать с id в манифесте
# стека, path указывает на каталог со stack.yaml относительно корня репозитория.
# Остальные поля попадают на карточку в каталоге.

apiVersion: dock/v1
kind: Registry
name: SHFF stacks
updated: 2026-11-04

stacks:
  - id: observability
    name: grafana + prometheus + loki
    version: 1.0.0
    category: мониторинг
    summary: 'Наблюдаемость из коробки. Grafana приезжает с прописанными датасорсами и тремя готовыми дашбордами — открыл и смотришь.'
    meta: '// 600 MB · 6 контейнеров'
    path: stacks/observability

  - id: vaultwarden
    name: vaultwarden
    version: 1.0.0
    category: данные
    summary: 'Менеджер паролей, совместимый с клиентами bitwarden. Регистрация закрыта, админ-токен генерируется при установке.'
    meta: '// 120 MB · 1 контейнер'
    path: stacks/vaultwarden

  - id: gitea
    name: gitea
    version: 1.0.0
    category: код
    summary: 'Лёгкий git-хостинг: репозитории, issues, actions. Живёт в одном контейнере с sqlite.'
    meta: '// 180 MB · 1 контейнер'
    path: stacks/gitea

  - id: gitlab
    name: gitlab-ce
    version: 1.0.0
    category: код
    summary: Репозитории, CI/CD, реестр образов и доски задач в одном сервисе. Тяжёлый — просит от 4 ГБ памяти.
    meta: '// 2.7 GB · 1 контейнер'
    path: stacks/gitlab

  - id: uptime-kuma
    name: uptime-kuma
    version: 1.0.0
    category: сеть
    summary: 'Мониторинг своих же сервисов. Пишет в телеграм, когда что-то упало.'
    meta: '// 320 MB · 1 контейнер'
    path: stacks/uptime-kuma

  - id: navidrome
    name: navidrome
    version: 1.1.0
    category: медиа
    summary: Стриминг своей музыкальной коллекции. Совместим с subsonic-клиентами.
    meta: '// 60 MB · 1 контейнер'
    path: stacks/navidrome

  - id: qbittorrent
    name: qbittorrent
    version: 1.1.1
    category: медиа
    summary: Торрент-клиент с веб-мордой. Раскладывает скачанное по общей медиатеке.
    meta: '// 200 MB · 1 контейнер'
    path: stacks/qbittorrent

  - id: torrserver
    name: torrserver
    version: 1.0.0
