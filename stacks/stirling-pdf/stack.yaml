apiVersion: dock/v1
kind: Stack

id: stirling-pdf
name: stirling-pdf
version: 1.0.0
category: инструменты
summary: Ножницы для PDF: режет, склеивает, поворачивает, конвертирует, ставит печати.
meta: '// 500 MB · 1 контейнер'
homepage: https://www.stirlingpdf.com

description: |
  Все операции с PDF одним окном: разделить/объединить, сжать,
  повернуть, наложить водяной знак, конвертировать в офисные форматы
  и обратно.

  Файлы обрабатываются внутри контейнера и никуда не уходят.

requires:
  memoryMiB: 512

primary: stirling-pdf

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 8287
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: pdf

volumes:
  - path: data/config
  - path: data/pipeline

compose:
  services:
    stirling-pdf:
      image: stirlingtools/stirling-pdf:latest
      restart: unless-stopped
      ports:
        - '${PORT}:8080'
      volumes:
        - ${DOCK_STACK_DIR}/data/config:/configs
        - ${DOCK_STACK_DIR}/data/pipeline:/pipeline
      environment:
        TZ: ${DOCK_TZ}
      labels:
        dock.stack: ${DOCK_STACK_ID}
        dock.role: primary
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Стартовая страница — список всех операций. Многостраничные настройки
    видны после выбора файла.
