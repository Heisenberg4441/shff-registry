apiVersion: dock/v1
kind: Stack

id: changedetection
name: changedetection
version: 1.0.0
category: автоматизация
summary: Следит за изменениями на страницах и шлёт уведомления, когда что-то изменилось.
meta: '// 300 MB · 1 контейнер'
homepage: https://changedetection.io

description: |
  Указываешь список страниц — сервис периодически их смотрит и пишет,
  когда текст изменился: появился товар, упала цена, вышла новая версия.

  Уведомления уходят в телеграм, gotify, email и ещё пара десятков
  куда угодно — настраивается после первого входа.

primary: changedetection

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 5000
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: watch

volumes:
  - path: data/datastore

compose:
  services:
    changedetection:
      image: ghcr.io/dgtlmoon/changedetection.io:latest
      restart: unless-stopped
      ports:
        - '${PORT}:5000'
      volumes:
        - ${DOCK_STACK_DIR}/data/datastore:/datastore
      environment:
        TZ: ${DOCK_TZ}
      labels:
        dock.stack: ${DOCK_STACK_ID}
        dock.role: primary
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Пароль на вход задаётся переменной в настройках стека: добавьте
    переменную DEFAULT_PASSWORD, если открываете наружу.

    Соседние сервисы для уведомлений видны по именам: например,
    gotify — http://gotify:80.
