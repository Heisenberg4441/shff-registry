apiVersion: dock/v1
kind: Stack

id: shff-planner
name: shff-planner
version: 1.0.0
category: личное
summary: Поминутный планировщик суток. Своя база, без облака и аккаунтов.
meta: '// 100 MB · 1 контейнер'
homepage: https://github.com/Heisenberg4441/shff-planner

description: |
  Размечает сутки целиком, а не список встреч. В дне 1440 минут, и каждая либо
  чем-то занята, либо видна как дыра в разметке. Планировщик считает, сколько
  ушло на работу и на быт, какое было самое длинное окно без прерываний и
  сколько раз за день менялся род занятий.

  Удачно размеченный день раскатывается на неделю, месяц или квартал — и одной
  кнопкой откатывается обратно, даже если задел шестьдесят дней.

  Пароля в описании нет намеренно: при первом заходе планировщик спросит сам —
  завести администратора или пустить без пароля. Замок живёт в базе, а не в
  конфиге, поэтому переезд тома переносит и доступ.

  Всё хранится в одном файле sqlite внутри каталога стека. Наружу сервис не
  ходит вообще — ни аналитики, ни шрифтов с чужих серверов.

  Собран только под amd64: sqlite под arm компилируется из исходников, и в
  сборку это пока не включено. На одноплатнике образ не поднимется.

primary: planner

requires:
  arch: ['amd64']

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 8787
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: plan

  - key: SEED
    label: Чем заполнить пустую базу
    type: enum
    options: ['none', 'demo']
    default: none
    hint: '// demo — примерная неделя вокруг сегодня, чтобы посмотреть все режимы'

  - key: TRUST_PROXY
    label: Стоит за reverse proxy
    type: bool
    default: false
    hint: '// от этого зависит, чей адрес попадёт в счётчик попыток входа'

volumes:
  # База, ключ сессии и настройки — всё здесь. Образ работает от uid 1000
  # (пользователь node), root ему недоступен: корень контейнера только на чтение.
  - path: data/planner
    owner: '1000:1000'

compose:
  services:
    planner:
      image: heisenberg4441/shff-planner:1.0.0
      restart: unless-stopped
      user: '${DOCK_PUID}:${DOCK_PGID}'
      ports:
        # внутри сервис всегда слушает 8787
        - '${PORT}:8787'
      volumes:
        - ${DOCK_STACK_DIR}/data/planner:/data
      environment:
        TZ: ${DOCK_TZ}
        SHFF_SEED: ${SEED}
        SHFF_TRUST_PROXY: ${TRUST_PROXY}
        SHFF_LOG_LEVEL: info
      # Сервис пишет только в /data, поэтому корень держим на чтение.
      read_only: true
      tmpfs:
        - /tmp
      security_opt:
        - no-new-privileges:true
      labels:
        dock.stack: ${DOCK_STACK_ID}
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Реквизитов нет: первый заход сам спросит, как закрывать доступ — завести
    логин с паролем или пустить без него. Дома, в своей сети, второе нормально;
    если планировщик виден из интернета — заводите пароль. Передумать можно
    потом: настройки → доступ.

    Разметка лежит в ${DOCK_STACK_DIR}/data/planner/planner.db. Отдельный бекап —
    настройки → бекап: скачивается обычный JSON, им же всё восстанавливается на
    другой машине.

    Забыли пароль — добавьте в ${DOCK_STACK_DIR}/.env строку
    SHFF_AUTH_PASSWORD=<временный>, перезапустите стек, войдите по ней и
    поставьте новый пароль в настройках. Потом строку уберите: пока она есть,
    вход идёт только по ней.
