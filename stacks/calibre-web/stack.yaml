apiVersion: dock/v1
kind: Stack

id: calibre-web
name: calibre-web
version: 1.0.0
category: книги
summary: Библиотека книг с читалкой в браузере и выгрузкой на электронную книгу.
meta: '// 250 MB · 1 контейнер'
homepage: https://github.com/janeczku/calibre-web

description: |
  Веб-оболочка над библиотекой calibre. Читает книги прямо в браузере,
  конвертирует форматы и отдаёт их на ридер по почте или OPDS.

  Каталог /books привязан к общей медиатеке — книги не пропадут при
  удалении стека.

primary: calibre-web

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 8083
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: library

volumes:
  - path: data/config

  # Общая медиатека: не удаляется вместе со стеком.
  - path: media/books
    shared: true
    owner: '1000:1000'

compose:
  services:
    calibre-web:
      image: lscr.io/linuxserver/calibre-web:latest
      restart: unless-stopped
      ports:
        - '${PORT}:8083'
      volumes:
        - ${DOCK_STACK_DIR}/data/config:/config
        - ${DOCK_MEDIA_DIR}/books:/books
      environment:
        PUID: ${DOCK_PUID}
        PGID: ${DOCK_PGID}
        TZ: ${DOCK_TZ}
      labels:
        dock.stack: ${DOCK_STACK_ID}
        dock.role: primary
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Логин по умолчанию: admin, пароль: admin123 — смените сразу.

    Укажите в настройках расположение базы calibre. Если библиотеки ещё
    нет, создайте пустую: кнопка на стартовом экране. Книги складывайте
    в ${DOCK_MEDIA_DIR}/books.
