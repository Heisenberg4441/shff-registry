apiVersion: dock/v1
kind: Stack

id: navidrome
name: navidrome
version: 1.1.0
category: медиа
summary: Стриминг своей музыкальной коллекции. Совместим с subsonic-клиентами.
meta: '// 60 MB · 1 контейнер'
homepage: https://www.navidrome.org

description: |
  Играет то, что лежит в общей медиатеке — /home/dock/media/music. Туда же
  качает qbittorrent по категории music, так что скачанное появляется в
  библиотеке само.

  Каталог монтируется только на чтение: navidrome ничего в нём не меняет.

primary: navidrome

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 4533
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: music

volumes:
  - path: data/navidrome
    owner: '1000:1000'

  # Общая медиатека: тот же каталог наполняет qbittorrent категорией music.
  - path: media/music
    shared: true
    owner: '1000:1000'

compose:
  services:
    navidrome:
      image: deluan/navidrome:0.53.3
      restart: unless-stopped
      user: '${DOCK_PUID}:${DOCK_PGID}'
      ports:
        - '${PORT}:4533'
      volumes:
        - ${DOCK_STACK_DIR}/data/navidrome:/data
        - ${DOCK_MEDIA_DIR}/music:/music:ro
      environment:
        ND_SCANSCHEDULE: 1h
        ND_LOGLEVEL: info
        ND_BASEURL: ''
        TZ: ${DOCK_TZ}
      labels:
        dock.stack: ${DOCK_STACK_ID}
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Первый зашедший пользователь становится администратором.

    Музыка читается из ${DOCK_MEDIA_DIR}/music. Каталог создан при установке,
    складывать туда можно чем угодно — qbittorrent с категорией music кладёт
    именно туда. Библиотека пересканируется раз в час.
