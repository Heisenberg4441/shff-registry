apiVersion: dock/v1
kind: Stack

id: npm
name: nginx-proxy-manager
version: 1.0.0
category: сеть
summary: Реверс-прокси с веб-панелью: хосты, сертификаты let's encrypt без конфигов.
meta: '// 300 MB · 1 контейнер'
homepage: https://nginxproxymanager.com

description: |
  Веб-морда над nginx: заводишь домен → указываешь порт сервиса
  внутри сети → получаешь https с авто-продлением сертификата.

  В панели SHFF свои домены уже раздаёт прокси, поэтому этот стек —
  для случаев, когда нужен отдельный прокси со своими правилами
  (несколько машин, нестандартные пути, свои сертификаты).

primary: npm

inputs:
  - key: PORT
    label: Порт веб-панели
    type: port
    default: 8296
    hostPort: true
    required: true

volumes:
  - path: data/data

compose:
  services:
    npm:
      image: jc21/nginx-proxy-manager:latest
      restart: unless-stopped
      ports:
        - '${PORT}:81'
      volumes:
        - ${DOCK_STACK_DIR}/data/data:/data
      environment:
        TZ: ${DOCK_TZ}
      labels:
        dock.stack: ${DOCK_STACK_ID}
        dock.role: primary
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Вход по умолчанию: admin@example.com / changeme12 — смените сразу.

    Порты 80 и 443 образа не опубликованы: чтобы npm принимал внешний
    http/https трафик, добавьте их в настройках стека, когда планируете
    использовать npm как главный вход.
