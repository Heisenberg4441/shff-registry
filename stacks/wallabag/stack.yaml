apiVersion: dock/v1
kind: Stack

id: wallabag
name: wallabag
version: 1.0.0
category: чтение
summary: «Прочитать позже»: сохраняет статьи чистым текстом без рекламы.
meta: '// 300 MB · 1 контейнер'
homepage: https://wallabag.org

description: |
  Свой pocket: статья по ссылке сохраняется текстом, доступна офлайн
  и разбивается на комфортные страницы. Есть клиенты для телефона
  и расширение для браузера.

  База — sqlite, отдельный сервер БД не нужен.

primary: wallabag

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 8281
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: read

volumes:
  - path: data/images
  - path: data/assets

compose:
  services:
    wallabag:
      image: wallabag/wallabag:latest
      restart: unless-stopped
      ports:
        - '${PORT}:80'
      volumes:
        - ${DOCK_STACK_DIR}/data/images:/var/www/wallabag/web/assets/images
        - ${DOCK_STACK_DIR}/data/assets:/var/www/wallabag/web/assets
      environment:
        SYMFONY__ENV__DATABASE_DRIVER: pdo_sqlite
        SYMFONY__ENV__DOMAIN_NAME: http://${DOCK_HOSTNAME}:${PORT}
        SYMFONY__ENV__FOSUSER_REGISTRATION: 'false'
        SYMFONY__ENV__TZ: ${DOCK_TZ}
      labels:
        dock.stack: ${DOCK_STACK_ID}
        dock.role: primary
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Логин по умолчанию: wallabag / wallabag — смените сразу
    (иконка пользователя → Config).

    Приложению на телефоне укажите адрес http://${DOCK_HOSTNAME}:${PORT}
    и этот логин в настройках клиента.
