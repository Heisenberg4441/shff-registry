apiVersion: dock/v1
kind: Stack

id: qbittorrent
name: qbittorrent
version: 1.1.0
category: медиа
summary: Торрент-клиент с веб-мордой. Раскладывает скачанное по общей медиатеке.
meta: '// 200 MB · 1 контейнер'
homepage: https://www.qbittorrent.org

description: |
  Качает в общую медиатеку /home/dock/media, а не внутрь себя: ту же
  библиотеку читают navidrome и медиасерверы, и снос качалки её не заденет.

  Раскладка по папкам сделана категориями. Их три — music, films и shows, —
  и они уже заведены с нужными путями: выбрали при добавлении торрента,
  дальше qbittorrent сам положит куда надо и там же оставит. Торрент без
  категории уходит в media/downloads.

  Пароль при первом запуске qbittorrent генерирует сам и печатает в свой
  журнал. Панель подхватывает его вместе с первыми строками вывода, так что
  искать его в консоли не нужно — он на вкладке «журнал» карточки сервиса.
  Первым делом смените: Tools → Options → Web UI.

primary: qbittorrent

inputs:
  - key: WEB_PORT
    label: Порт веб-морды
    type: port
    default: 8080
    hostPort: true
    required: true

  - key: TORRENT_PORT
    label: Порт для торрентов
    type: port
    default: 6881
    hostPort: true
    required: true
    hint: '// его же пробрасывать на роутере, иначе только скачивание'

  - key: DOMAIN
    label: Поддомен
    type: string
    default: torrent

volumes:
  - path: data/config
    owner: '1000:1000'

  # Общая медиатека: путь считается от /home/dock, вместе со стеком она не
  # удаляется. Эти же каталоги ждут navidrome и будущая медиатека.
  - path: media/downloads
    shared: true
    owner: '1000:1000'
  - path: media/music
    shared: true
    owner: '1000:1000'
  - path: media/films
    shared: true
    owner: '1000:1000'
  - path: media/shows
    shared: true
    owner: '1000:1000'

files:
  # Категории qbittorrent с путями сохранения. Кладутся до первого старта —
  # тогда они уже есть в выпадающем списке при добавлении торрента.
  - path: data/config/qBittorrent/categories.json
    content: |
      {
          "films": { "save_path": "/media/films" },
          "music": { "save_path": "/media/music" },
          "shows": { "save_path": "/media/shows" }
      }

  # Минимальный конфиг: куда складывать всё остальное и включённое
  # автоуправление, из-за которого торрент category=music физически лежит
  # в /media/music, а не просто помечен ею.
  - path: data/config/qBittorrent/qBittorrent.conf
    content: |
      [BitTorrent]
      Session\DefaultSavePath=/media/downloads
      Session\TempPath=/media/downloads/.incomplete
      Session\TempPathEnabled=true
      Session\TorrentContentLayout=Original

      [Preferences]
      Downloads\SavePath=/media/downloads
      Downloads\TempPath=/media/downloads/.incomplete
      Downloads\TempPathEnabled=true

compose:
  services:
    qbittorrent:
      image: linuxserver/qbittorrent:5.2.3_v2.0.13-ls469
      restart: unless-stopped
      ports:
        # Порт веб-морды совпадает снаружи и внутри: образ поднимает интерфейс
        # ровно на WEBUI_PORT, и разъезд с публикацией даёт пустую страницу.
        - '${WEB_PORT}:${WEB_PORT}'
        - '${TORRENT_PORT}:${TORRENT_PORT}/tcp'
        - '${TORRENT_PORT}:${TORRENT_PORT}/udp'
      volumes:
        - ${DOCK_STACK_DIR}/data/config:/config
        # Медиатека монтируется целиком одним томом: иначе qbittorrent не
        # сможет перекладывать готовое из downloads в films без копирования
        # через границу монтирования.
        - ${DOCK_MEDIA_DIR}:/media
      environment:
        PUID: ${DOCK_PUID}
        PGID: ${DOCK_PGID}
        TZ: ${DOCK_TZ}
        WEBUI_PORT: ${WEB_PORT}
        TORRENTING_PORT: ${TORRENT_PORT}
      labels:
        dock.stack: ${DOCK_STACK_ID}
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${WEB_PORT}'
  notes: |
    Логин: admin
    Пароль: временный, его печатает сам qbittorrent. Откройте вкладку «журнал»
    на карточке сервиса и найдите строку «A temporary password is provided for
    this session». Смените его сразу: Tools → Options → Web UI.

    Куда что попадает:
      категория music  → ${DOCK_MEDIA_DIR}/music
      категория films  → ${DOCK_MEDIA_DIR}/films
      категория shows  → ${DOCK_MEDIA_DIR}/shows
      без категории    → ${DOCK_MEDIA_DIR}/downloads

    Категория выбирается в окне добавления торрента. Полностью автоматическая
    сортировка — это задача sonarr и radarr: они сами определяют, что скачали,
    и раскладывают по библиотеке. qbittorrent такого не умеет.
