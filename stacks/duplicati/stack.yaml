apiVersion: dock/v1
kind: Stack

id: duplicati
name: duplicati
version: 1.0.0
category: данные
summary: Бэкапы каталогов на удалённые хранилища по расписанию с шифрованием.
meta: '// 300 MB · 1 контейнер'
homepage: https://duplicati.com

description: |
  Регулярно архивирует выбранные каталоги в облако или на другой
  сервер: s3, webdav, ssh, яндекс-диск через webdav. Всё шифруется
  до отправки, восстановление — по дереву версий.

  Каталог source смонтирован к корню хоста, чтобы в бэкап можно
  было взять любой путь.

primary: duplicati

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 8200
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: backup

volumes:
  - path: data/config
  - path: data/backups

compose:
  services:
    duplicati:
      image: lscr.io/linuxserver/duplicati:latest
      restart: unless-stopped
      ports:
        - '${PORT}:8200'
      volumes:
        - ${DOCK_STACK_DIR}/data/config:/config
        - ${DOCK_STACK_DIR}/data/backups:/backups
        - /:/source:ro
      environment:
        PUID: ${DOCK_PUID}
        PGID: ${DOCK_PGID}
        TZ: ${DOCK_TZ}
      labels:
        dock.stack: ${DOCK_STACK_ID}
        dock.role: primary
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Пароль на веб-интерфейс задаётся в настройках стека переменной
    SETTINGS_ENCRYPTION_KEY? Нет — интерфейс duplicati сам попросит
    пароль при первом входе.

    Первое задание: Add backup → выбрать назначение (webdav/s3/ssh)
    → указать исходные пути из /source. Бэкапить конфиги стеков:
    каталоги вида stacks/<id>/data.
