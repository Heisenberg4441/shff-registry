apiVersion: dock/v1
kind: Stack

id: searxng
name: searxng
version: 1.0.0
category: сеть
summary: Своя мета-поисковая система: агрегирует результаты десятков поисковиков без трекинга.
meta: '// 300 MB · 1 контейнер'
homepage: https://searxng.org

description: |
  Ищет одновременно у гугла, бинга, дукдукго и других, смешивает
  выдачу и не отдаёт им ваши запросы в чистом виде. Без аккаунтов
  и рекламы.

  Секретный ключ и базовые настройки кладутся конфигом при установке.

primary: searxng

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 8297
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: search

  - key: SECRET_KEY
    label: Секретный ключ
    type: secret
    generate: hex32
    hint: '// оставь пустым — сгенерирую'

volumes:
  - path: data/config

files:
  - path: config/settings.yml
    template: files/settings.yml.tmpl

compose:
  services:
    searxng:
      image: searxng/searxng:latest
      restart: unless-stopped
      ports:
        - '${PORT}:8080'
      volumes:
        - ${DOCK_STACK_DIR}/data/config:/etc/searxng:ro
      environment:
        SEARXNG_BASE_URL: http://${DOCK_HOSTNAME}:${PORT}/
        TZ: ${DOCK_TZ}
      labels:
        dock.stack: ${DOCK_STACK_ID}
        dock.role: primary
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    В настройках браузера добавьте searxng как поисковик по умолчанию:
    адрес для запроса — http://${DOCK_HOSTNAME}:${PORT}/search?q=%s.

    Раздел Preferences → Engines включает и выключает отдельные
    поисковые движки.
