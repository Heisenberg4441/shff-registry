apiVersion: dock/v1
kind: Stack

id: shff-notes
name: shff-notes
version: 1.0.0
category: личное
summary: Личные заметки с markdown и поиском. Своя база, без облака и аккаунтов.
meta: '// 100 MB · 1 контейнер'
homepage: https://github.com/Heisenberg4441/shff-notes

description: |
  Заметки лежат на своём сервере, а не в чужом сервисе, который завтра закроют
  или поменяет правила. Одно поле, один цвет, ничего больше: открыл, написал,
  закрыл. Кнопки «Сохранить» нет — текст уходит на сервер, пока думаешь над
  следующей строкой, а оборванная сеть ставит правку в очередь и досылает её,
  когда связь вернётся.

  Markdown появляется, когда он нужен: обычный текст остаётся обычным текстом,
  а предпросмотр показывает заголовки, списки, таблицы и код. Поиск идёт по
  заголовку, тексту и тегам сразу, и ищет он слова, а не звёздочки разметки.

  Открытые вкладки держатся в курсе сами: правка с телефона тут же видна на
  ноутбуке. Уйти можно в любой момент — выгрузка отдаёт json целиком или zip,
  где каждая заметка отдельным md-файлом, читаемым любым редактором.

  Пароля в описании нет намеренно: при первом заходе сервис спросит сам —
  завести администратора или пустить без пароля. Замок живёт в базе, а не в
  конфиге, поэтому переезд тома переносит и доступ.

  Всё хранится в одном файле sqlite внутри каталога стека. Наружу сервис не
  ходит вообще — ни аналитики, ни шрифтов с чужих серверов.

primary: notes

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 8788
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: notes

  - key: SEED
    label: Чем заполнить пустую базу
    type: enum
    options: ['none', 'demo']
    default: none
    hint: '// demo — четыре заметки про homelab, чтобы посмотреть, как это выглядит'

  - key: TRUST_PROXY
    label: Стоит за reverse proxy
    type: bool
    default: false
    hint: '// от этого зависит, чей адрес попадёт в счётчик попыток входа'

  - key: HTTPS
    label: Отдаётся наружу по https
    type: bool
    default: false
    hint: '// cookie сессии станет Secure; по обычному http вход перестанет сохраняться'

volumes:
  # База, ключ сессии и настройки — всё здесь. Образ работает от uid 1000
  # (пользователь node), root ему недоступен: корень контейнера только на чтение.
  - path: data/notes
    owner: '1000:1000'

compose:
  services:
    notes:
      image: heisenberg4441/shff-notes:latest
      restart: unless-stopped
      user: '${DOCK_PUID}:${DOCK_PGID}'
      ports:
        # внутри сервис всегда слушает 8788
        - '${PORT}:8788'
      volumes:
        - ${DOCK_STACK_DIR}/data/notes:/data
      environment:
        TZ: ${DOCK_TZ}
        SHFF_SEED: ${SEED}
        SHFF_TRUST_PROXY: ${TRUST_PROXY}
        SHFF_HTTPS: ${HTTPS}
        # Аварийный вход. Пусто, пока строку не допишут в .env руками — ради
        # этого переменная и объявлена: иначе она из .env в контейнер не попадёт.
        SHFF_AUTH_PASSWORD: ${SHFF_AUTH_PASSWORD:-}
      # Сервис пишет только в /data, поэтому корень держим на чтение.
      read_only: true
      tmpfs:
        - /tmp
        # next держит здесь временные файлы ответов
        - /app/.next/cache
      security_opt:
        - no-new-privileges:true
      labels:
        dock.stack: ${DOCK_STACK_ID}
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Реквизитов нет: первый заход сам спросит, как закрывать доступ — завести
    логин с паролем или пустить без него. Дома, в своей сети, второе нормально;
    если заметки видны из интернета — заводите пароль. Передумать можно потом:
    настройки → доступ.

    Заметки лежат в ${DOCK_STACK_DIR}/data/notes/notes.db. Отдельный бекап —
    настройки → данные: json со всем сразу вместе с корзиной и настройками либо
    zip, где каждая заметка отдельным md-файлом. Ими же всё восстанавливается на
    другой машине.

    Забыли пароль — добавьте в ${DOCK_STACK_DIR}/.env строку
    SHFF_AUTH_PASSWORD=<временный>, перезапустите стек, войдите по ней и
    поставьте новый пароль в настройках. Потом строку уберите: пока она есть,
    вход идёт только по ней.
