apiVersion: dock/v1
kind: Stack

id: homepage
name: homepage
version: 1.0.0
category: инструменты
summary: Дашборд со ссылками на все свои сервисы: статусы, виджеты, поиск.
meta: '// 150 MB · 1 контейнер'
homepage: https://gethomepage.dev

description: |
  Стартовая страница для браузера: плитки сервисов с живым статусом,
  виджеты погоды и поиск, быстрые ссылки. Настраивается yaml-файлами
  в каталоге конфига.

  Соседние стеки автоматически видит по ярлыкам докера — сервисы
  из каталога подхватываются сами.

primary: homepage

inputs:
  - key: PORT
    label: Порт
    type: port
    default: 3002
    hostPort: true
    required: true

  - key: DOMAIN
    label: Поддомен
    type: string
    default: home

volumes:
  - path: data/config
    owner: '1000:1000'

compose:
  services:
    homepage:
      image: ghcr.io/gethomepage/homepage:latest
      restart: unless-stopped
      ports:
        - '${PORT}:3000'
      volumes:
        - ${DOCK_STACK_DIR}/data/config:/app/config
        - /var/run/docker.sock:/var/run/docker.sock:ro
      environment:
        PUID: ${DOCK_PUID}
        PGID: ${DOCK_PGID}
        TZ: ${DOCK_TZ}
        HOMEPAGE_ALLOWED_HOSTS: '${DOCK_HOSTNAME}:${PORT},${DOMAIN}.${DOCK_DOMAIN}'
      labels:
        dock.stack: ${DOCK_STACK_ID}
        dock.role: primary
  networks:
    default:
      name: ${DOCK_NETWORK}
      external: true

post:
  url: 'http://${DOCK_HOSTNAME}:${PORT}'
  notes: |
    Конфиги — в ${DOCK_STACK_DIR}/data/config: services.yaml (плитки),
    widgets.yaml (виджеты), settings.yaml. Правки подхватываются
    мгновенно, перезапуск не нужен.

    Статусы контейнеров берутся с docker-сокета, он смонтирован только
    на чтение.
